<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Defence in depth next to the Referrer-Policy header (public/_headers). A CSP is delivered by header only, not via meta. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Sets html lang from the stored language before React mounts. External classic script (no inline code) so a CSP of script-src 'self' keeps working. -->
    <script src="/early-lang.js"></script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#073F29" />
    <link rel="icon" type="image/png" href="/icons/kalinga-logo.png" />
    <link rel="apple-touch-icon" href="/icons/kalinga-logo.png" />
    <title>KALINGA (DEMO)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
